# yaml-language-server: $schema=https://raw.githubusercontent.com/chris48s/v8r/main/config-schema.json
customCatalog:
  schemas:
    - name: v8r
      fileMatch:
        - .config/v8rrc.yaml
      location: https://raw.githubusercontent.com/chris48s/v8r/main/config-schema.json
      parser: yaml

    - name: tsconfig
      fileMatch:
        - "**/tsconfig*.json"
      location: https://www.schemastore.org/tsconfig
      parser: json5

    - name: shadcn
      fileMatch:
        - components.json
      location: https://ui.shadcn.com/schema.json
      parser: json5
